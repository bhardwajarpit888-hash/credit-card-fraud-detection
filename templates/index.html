
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Card Fraud Detector</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#5d6877; --border:#d9dee5; --accent:#2457d6; --ok:#1a7f4b; --bad:#c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12161c; --card:#1b212b; --text:#e8ecf1; --muted:#98a3b3; --border:#2f3846; --accent:#6b95ff; --ok:#4cc38a; --bad:#ff7b6b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text); font-family:system-ui,"Segoe UI",Arial,sans-serif; line-height:1.5; }
    main { max-width:760px; margin:0 auto; }
    h1 { font-size:1.5rem; margin:0 0 4px; }
    .sub { margin:0 0 20px; color:var(--muted); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
    textarea { width:100%; min-height:220px; font-family:Consolas,monospace; font-size:12px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; }
    .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    #result { font-size:1.1rem; }
    .fraud { color:var(--bad); font-weight:600; }
    .legit { color:var(--ok); font-weight:600; }
    .note { font-size:.85rem; color:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Credit Card Fraud Detector</h1>
  <p class="sub">Model: {{ model_name }} &middot; decision threshold: {{ threshold }}</p>

  <div class="card">
    <label for="payload"><strong>Transaction features</strong> (JSON with Time, V1 to V28, Amount)</label>
    <textarea id="payload" spellcheck="false"></textarea>
    <div class="row">
      {% if has_samples %}
      <button type="button" id="load-legit">Load sample: legitimate</button>
      <button type="button" id="load-fraud">Load sample: fraud</button>
      {% endif %}
      <button type="button" class="primary" id="check">Check transaction</button>
    </div>
  </div>

  <div class="card" id="result-card" hidden>
    <div id="result" aria-live="polite"></div>
  </div>

  <p class="note">Portfolio demo trained on the public Kaggle credit card fraud dataset (anonymised PCA features). Not a production system; do not use for real financial decisions.</p>
</main>

<script>
  var box = document.getElementById("payload");
  var resultCard = document.getElementById("result-card");
  var resultEl = document.getElementById("result");
  var checkBtn = document.getElementById("check");

  function show(parts) {
    resultEl.textContent = "";
    parts.forEach(function (p) {
      var span = document.createElement("span");
      span.textContent = p.text;
      if (p.cls) span.className = p.cls;
      resultEl.appendChild(span);
    });
    resultCard.hidden = false;
  }

  function loadSample(kind) {
    fetch("/api/sample/" + kind)
      .then(function (r) { return r.json(); })
      .then(function (data) { box.value = JSON.stringify(data, null, 2); resultCard.hidden = true; })
      .catch(function () { show([{ text: "Could not load the sample." }]); });
  }

  var legitBtn = document.getElementById("load-legit");
  var fraudBtn = document.getElementById("load-fraud");
  if (legitBtn) legitBtn.addEventListener("click", function () { loadSample("legit"); });
  if (fraudBtn) fraudBtn.addEventListener("click", function () { loadSample("fraud"); });

  checkBtn.addEventListener("click", function () {
    var payload;
    try { payload = JSON.parse(box.value); }
    catch (e) { show([{ text: "That is not valid JSON." }]); return; }
    checkBtn.disabled = true;
    fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) { show([{ text: "Error: " + res.data.error }]); return; }
        var d = res.data;
        var pct = (d.fraud_probability * 100).toFixed(1) + "%";
        show([
          { text: d.is_fraud ? "Flagged as FRAUD" : "Looks legitimate", cls: d.is_fraud ? "fraud" : "legit" },
          { text: "  |  fraud probability " + pct + " (threshold " + d.threshold + ")" }
        ]);
      })
      .catch(function () { show([{ text: "Request failed. Is the server running?" }]); })
      .finally(function () { checkBtn.disabled = false; });
  });
</script>
</body>
</html>
